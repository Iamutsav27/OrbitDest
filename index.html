
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flask API demo</title>
    <style>
      :root{ --bg:#fbfcfd; --muted:#6b7280; --panel:#f6f8fa; --accent:#0366d6 }
      body{ font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial; background:var(--bg); color:#111827; padding:28px }
      .container{ max-width:900px; margin:0 auto }
      header{ display:flex; align-items:center; justify-content:space-between }
      h1{ margin:0; font-size:24px }
      .controls{ display:flex; gap:8px; align-items:center }
      input[type=text]{ padding:8px 10px; border:1px solid #e6e9ee; border-radius:6px }
      button{ padding:8px 10px; border-radius:6px; border:1px solid #d1d5db; background:white; cursor:pointer }
      section{ background:white; padding:16px; border-radius:8px; box-shadow:0 1px 0 rgba(0,0,0,0.03); margin-top:18px }
      label{ display:block; margin-top:10px; font-size:14px; color:var(--muted) }
      .row{ display:flex; gap:10px; align-items:center; margin-top:8px }
      pre{ background:var(--panel); padding:12px; border-radius:6px; overflow:auto; white-space:pre-wrap }
      .status{ font-weight:600 }
      .status.ok{ color:green }
      .status.err{ color:#b91c1c }
      footer{ margin-top:20px; color:var(--muted); font-size:13px }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Flask API demo</h1>
        <div class="controls">
          <label style="font-size:13px;color:var(--muted)">API URL</label>
          <input id="api-url" type="text" value="http://localhost:5000" style="width:260px" />
          <button id="btn-ping">Ping</button>
          <div id="health-ind" class="status">—</div>
        </div>
      </header>

      <!-- Admin auth -->
      <section>
        <h2>Superadmin</h2>
        <label>Username</label>
        <div class="row">
          <input id="admin-username" value="superadmin" />
          <input id="admin-password" type="password" value="Utsav@2709" />
          <button id="btn-admin-login">Login</button>
          <div id="admin-token" style="margin-left:8px;color:var(--muted)">-</div>
        </div>
        <div style="margin-top:8px;color:var(--muted);font-size:13px">After login, token is stored in localStorage and used for admin requests.</div>
      </section>

      <section>
        <h2>Admin - Clients</h2>
        <div class="row">
          <input id="new-client-name" placeholder="Client name" />
          <button id="btn-create-client">Create client</button>
          <button id="btn-refresh-clients">Refresh list</button>
        </div>
        <pre id="clients-list">-</pre>
        <div style="margin-top:12px">
          <label>Select client to manage channels</label>
          <div class="row">
            <select id="client-select" style="min-width:260px"></select>
            <button id="btn-load-channels">Load channels</button>
          </div>
          <div id="channels-panel" style="margin-top:12px">
            <div><label><input type="checkbox" value="email" /> Email</label></div>
            <div><label><input type="checkbox" value="sms" /> SMS</label></div>
            <div><label><input type="checkbox" value="whatsapp" /> WhatsApp</label></div>
            <div><label><input type="checkbox" value="telegram" /> Telegram</label></div>
            <div><label><input type="checkbox" value="facebook" /> Facebook</label></div>
            <div><label><input type="checkbox" value="webchat" /> Webchat</label></div>
            <div class="row" style="margin-top:8px">
              <button id="btn-save-channels">Save channels</button>
              <div id="channels-status" style="margin-left:8px;color:var(--muted)">-</div>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2>Client - Register / Login</h2>
        <label>Client ID (from Admin clients list)</label>
        <div class="row">
          <input id="reg-client-id" placeholder="client id" />
        </div>
        <label>Username</label>
        <div class="row">
          <input id="reg-username" />
          <input id="reg-password" type="password" />
          <button id="btn-register">Register</button>
        </div>
        <div style="height:8px"></div>
        <label>Login</label>
        <div class="row">
          <input id="login-username" />
          <input id="login-password" type="password" />
          <button id="btn-login">Login</button>
          <div id="client-token" style="margin-left:8px;color:var(--muted)">-</div>
        </div>
      </section>

      <section>
        <h2>/health</h2>
        <div class="row">
          <button id="btn-health">Call /health</button>
          <div id="out-health">-</div>
        </div>
        <pre id="raw-health">-</pre>
      </section>

      <section>
        <h2>/echo</h2>
        <label>Message</label>
        <div class="row">
          <input id="echo-msg" value="hello world" style="flex:1" />
          <button id="btn-echo">Call /echo</button>
        </div>
        <pre id="out-echo">-</pre>
      </section>

      <section>
        <h2>/sum</h2>
        <label>Numbers (comma-separated)</label>
        <div class="row">
          <input id="sum-nums" value="1,2,3" style="flex:1" />
          <button id="btn-sum">Call /sum</button>
        </div>
        <pre id="out-sum">-</pre>
      </section>

      <footer>Run the Flask app with <code>python app.py</code> or `docker-compose up` and ensure the API URL above matches.</footer>
    </div>

    <script>
      const $ = id => document.getElementById(id)

      function apiBase(){ return $('api-url').value.trim() || 'http://localhost:5000' }

      async function call(path, opts={}){
        const base = apiBase()
        try{
          const res = await fetch(base + path, opts)
          const text = await res.text()
          try{ return { ok: true, status: res.status, body: JSON.parse(text) } }catch(e){ return { ok: true, status: res.status, body: text } }
        }catch(err){ return { ok:false, error: String(err) } }
      }

      async function updateHealthIndicator(){
        const r = await call('/health')
        const el = $('health-ind')
        if(r.ok && r.status===200){ el.textContent = 'OK'; el.className='status ok' } else { el.textContent='DOWN'; el.className='status err' }
      }

      // Admin login
      $('btn-admin-login').onclick = async ()=>{
        const username = $('admin-username').value
        const password = $('admin-password').value
        const r = await call('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) })
        if(r.ok && r.status===200 && r.body.token){
          localStorage.setItem('admin_token', r.body.token)
          $('admin-token').textContent = 'token saved'
        } else {
          $('admin-token').textContent = r.body?.error || r.error || 'login failed'
        }
      }

      function adminHeaders(){
        const t = localStorage.getItem('admin_token')
        return t ? { 'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' }
      }

      // Create client
      $('btn-create-client').onclick = async ()=>{
        const name = $('new-client-name').value
        const r = await call('/clients', { method:'POST', headers: adminHeaders(), body: JSON.stringify({ name }) })
        $('clients-list').textContent = r.ok ? JSON.stringify(r.body, null, 2) : r.error
        await refreshClientSelect()
      }

      $('btn-refresh-clients').onclick = async ()=>{
        const r = await call('/clients', { headers: adminHeaders() })
        $('clients-list').textContent = r.ok ? JSON.stringify(r.body, null, 2) : r.error
        await refreshClientSelect()
      }

      async function refreshClientSelect(){
        const r = await call('/clients', { headers: adminHeaders() })
        const sel = $('client-select')
        sel.innerHTML = ''
        if(r.ok && r.body && Array.isArray(r.body.clients)){
          r.body.clients.forEach(c=>{
            const opt = document.createElement('option')
            opt.value = c.id
            opt.textContent = c.name + ' (' + c.id + ')'
            sel.appendChild(opt)
          })
        }
      }

      $('btn-load-channels').onclick = async ()=>{
        const clientId = $('client-select').value
        if(!clientId){ $('channels-status').textContent = 'select client'; return }
        const r = await call(`/clients/${clientId}/channels`, { headers: adminHeaders() })
        if(r.ok && r.body && Array.isArray(r.body.channels)){
          const boxes = document.querySelectorAll('#channels-panel input[type=checkbox]')
          boxes.forEach(b=> b.checked = r.body.channels.includes(b.value))
          $('channels-status').textContent = 'loaded'
        } else {
          $('channels-status').textContent = r.body?.error || r.error || 'failed'
        }
      }

      $('btn-save-channels').onclick = async ()=>{
        const clientId = $('client-select').value
        if(!clientId){ $('channels-status').textContent = 'select client'; return }
        const boxes = document.querySelectorAll('#channels-panel input[type=checkbox]')
        const channels = Array.from(boxes).filter(b=>b.checked).map(b=>b.value)
        const r = await call(`/clients/${clientId}/channels`, { method:'POST', headers: adminHeaders(), body: JSON.stringify({ channels }) })
        if(r.ok){ $('channels-status').textContent = 'saved' } else { $('channels-status').textContent = r.body?.error || r.error || 'failed' }
      }

      // load client select on startup
      refreshClientSelect()

      // Client register
      $('btn-register').onclick = async ()=>{
        const clientId = $('reg-client-id').value
        const username = $('reg-username').value
        const password = $('reg-password').value
        const r = await call(`/clients/${clientId}/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) })
        if(r.ok && r.status===200){
          $('client-token').textContent = 'registered: token saved'
          localStorage.setItem('client_token', r.body.token)
        } else {
          $('client-token').textContent = r.body?.error || r.error || 'register failed'
        }
      }

      // Client login
      $('btn-login').onclick = async ()=>{
        const username = $('login-username').value
        const password = $('login-password').value
        const r = await call('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, password }) })
        if(r.ok && r.status===200){
          localStorage.setItem('client_token', r.body.token)
          $('client-token').textContent = 'login token saved'
        } else {
          $('client-token').textContent = r.body?.error || r.error || 'login failed'
        }
      }

      $('btn-ping').onclick = updateHealthIndicator

      $('btn-health').onclick = async ()=>{
        $('out-health').textContent = 'loading...'
        const r = await call('/health')
        if(r.ok) $('raw-health').textContent = JSON.stringify(r.body, null, 2)
        else $('raw-health').textContent = r.error
      }

      $('btn-echo').onclick = async ()=>{
        $('out-echo').textContent = 'loading...'
        const msg = $('echo-msg').value
        const r = await call('/echo', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ msg }) })
        $('out-echo').textContent = r.ok ? JSON.stringify(r.body, null, 2) : r.error
      }

      $('btn-sum').onclick = async ()=>{
        $('out-sum').textContent = 'loading...'
        const raw = $('sum-nums').value
        const numbers = raw.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n))
        const r = await call('/sum', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ numbers }) })
        $('out-sum').textContent = r.ok ? JSON.stringify(r.body, null, 2) : r.error
      }

      // initial check
      updateHealthIndicator()
    </script>
  </body>
</html>
